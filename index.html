<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Atendimento</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#e31212; /* Vermelho Vibrante estilo Claro/Ferrari */
color:white;
text-align:center;
}

.container{
padding:40px 20px;
}

.logo{
font-size:30px;
font-weight:bold;
margin-bottom:10px;
text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.sub{
color:white; /* Branco puro para máximo contraste sobre o vermelho */
margin-bottom:40px;
opacity: 0.9;
}

.card{
background:#ffffff; /* Card branco para destacar sobre o fundo vermelho vibrante */
color: #e31212; /* Texto do card em vermelho */
margin:15px auto;
padding:25px;
border-radius:15px;
max-width:320px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card h3{
margin-top:0;
font-weight: 800;
}

.card p {
color: #333; /* Texto secundário do card em cinza escuro para leitura */
}

.btn{
display:block;
background:#25d366; /* Verde WhatsApp */
color:white;
text-decoration:none;
padding:14px;
border-radius:10px;
margin-top:15px;
font-weight:bold;
font-size: 16px;
transition: 0.3s;
}

.btn:hover{
transform: scale(1.05);
background: #1eb954;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">SUPORTE AO CLIENTE</div>
<div class="sub">Escolha uma opção de atendimento</div>

<div class="card">
<h3>Sem conexão ou Instabilidade</h3>
<p>Fale com um atendente agora</p>
<a class="btn" href="https://wa.me/5514920030892">Abrir WhatsApp</a>
</div>

<div class="card">
<h3>Suporte Técnico</h3>
<p>Internet lenta ou sem conexão</p>
<a class="btn" href="https://wa.me/5514920030892">Solicitar Suporte</a>
</div>

<div class="card">
<h3>Guia atualizada</h3>
<p>Atualização</p>
<a class="btn" href="https://wa.me/5514920030892">Falar com Atendente</a>
</div>

</div>

</body>
</html>
